---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

type: dnf
repos:
  cleanup: true
  copr:
    enable:
      - scottames/ghostty
  files:
   - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
install:
  packages:
    - zsh
    - fzf
    - zoxide
    - fastfetch
    - hyfetch
    - git
    - gh
    - btop
    - firefox
    # TERRA
    - terra-release
    - terra-release-extras
    - terra-gpg-keys
    # COPR
    - ghostty
    # URLs
    - https://vencord.dev/download/vesktop/amd64/rpm
remove:
  packages:
    - waydroid
    - waydroid-selinux
    - input-remapper
    - bazaar
    - krunner-bazaar
    - kde-connect
    - kdeconnectd
    - kde-connect-libs
    - topgrade
    - bazzite-portal
    # Bold Brew
