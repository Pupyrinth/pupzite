---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

type: dnf
repos:
  cleanup: true
  copr:
    enable:
      - scottames/ghostty
  files:
    - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    - https://repository.mullvad.net/rpm/stable/mullvad.repo
    - https://download.opensuse.org/repositories/home:Alxhr0/Fedora_44/home:Alxhr0.repo
    - vscode.repo
  keys:
    - https://packages.microsoft.com/keys/microsoft.asc
install:
  packages:
    - bottles
    - btop
    - fastfetch
    - firefox
    - fzf
    - gamemode
    - gh
    - gimp
    - git
    - gnome-disk-utility
    - hyfetch
    - java-25-openjdk
    - java-latest-openjdk
    - libreoffice
    - mpv
    - nodejs
    - pipx
    - python3
    - python3-pip
    - uv
    - vim
    - vlc
    - vorta
    - zsh
    - zoxide
    # --- NOT FROM FEDORA PACKAGES ---
    # STANDALONE REPO
    - code
    - mullvad-vpn
    # TERRA
    - terra-release
    - terra-release-extras
    - terra-gpg-keys
    - blockbench
    - lact
    - localsend-bin
    - prismlauncher
    - protonplus
    #  ALXHR0
    - hourglass
    # COPR
    - ghostty
    # URLs
    - https://opencode.ai/download/stable/linux-x64-rpm
    - https://vencord.dev/download/vesktop/amd64/rpm
remove:
  packages:
    - bazaar
    - bazzite-portal
    - input-remapper
    - kdeconnectd
    - kde-connect
    - kde-connect-libs
    - krunner-bazaar
    - topgrade
    - waydroid
    - waydroid-selinux
    # Bold Brew
